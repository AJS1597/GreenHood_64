<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GreenHood 64 - a first-person Robin Hood stealth-archer dungeon crawler." />
    <title>GreenHood 64</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="render-canvas" touch-action="none"></canvas>

    <div id="loading-screen" class="overlay">
      <div class="loading-panel">
        <h1 class="game-title">GreenHood <span>64</span></h1>
        <p class="loading-label" id="loading-label">Preparing the forest&hellip;</p>
        <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
        <p class="loading-detail" id="loading-detail">0%</p>
      </div>
    </div>

    <div id="hud" hidden>
      <div id="crosshair" class="crosshair"></div>
      <div class="hud-wallet">
        <span class="pill is-gold"><span id="hud-gold">0</span> gold</span>
        <span class="pill is-crown"><span id="hud-crowns">0</span> crowns</span>
      </div>
      <div id="hud-floor" class="hud-floor" hidden></div>
      <div id="hud-prompt" class="hud-prompt" hidden><kbd>E</kbd> <span id="hud-prompt-text"></span></div>
      <div id="hud-toast" class="hud-toast" hidden></div>
      <div class="hud-hint">WASD move &middot; Mouse look &middot; Shift sprint &middot; Ctrl crouch &middot; E interact</div>
    </div>

    <div id="click-to-play" class="resume-hint" hidden>
      <div class="resume-card">
        <p class="resume-title" id="click-title">Paused</p>
        <p class="resume-subtitle" id="click-subtitle">Click or press Esc to resume</p>
      </div>
    </div>

    <div id="shop" class="overlay shop-overlay" hidden>
      <div class="shop-panel">
        <header class="shop-header">
          <h2 id="shop-title">Merchant</h2>
          <button id="shop-close" class="shop-close" type="button">Close (Esc)</button>
        </header>
        <nav id="shop-tabs" class="shop-tabs"></nav>
        <div id="shop-items" class="shop-items"></div>
        <footer class="shop-footer"><span id="shop-wallet">Gold 0   Crowns 0</span></footer>
      </div>
    </div>

    <div id="fade" class="fade" hidden></div>

    <div id="debug-hud" class="debug-hud" hidden>
      <div><span class="debug-key">FPS</span> <span id="debug-fps">--</span></div>
      <div><span class="debug-key">Seed</span> <span id="debug-seed">--</span></div>
      <div><span class="debug-key">State</span> <span id="debug-state">--</span></div>
      <div><span class="debug-key">Pos</span> <span id="debug-pos">--</span></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
